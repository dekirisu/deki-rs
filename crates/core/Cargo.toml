[package]
name = "deki_core"
version = "0.2.0"
edition = "2024"

authors = ["Dekirisu <dekirisu@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A collection of crates, functions and renames tailored to myself!"
repository = "https://github.com/dekirisu/deki-rs/"
documentation = "https://docs.rs/deki_core"
categories = ["development-tools"]
keywords = ["utility", "helpers", "math"]

[dependencies]
deki_macros = { workspace = true }
derive-new = "0.7.0"
extension-traits.workspace = true   
buns = "0.1"
fastrand = {version="2.2.0",optional=true}

derive_more = {version="1.0.0",features=["full"], optional = true}
maflow.workspace = true
type_cell = "0.3"
paste = "1.0"

[features]
default = ["random","approx","lerp","derive_more"]
random = ["dep:fastrand"]
approx = []
lerp = []
derive_more = ["dep:derive_more"]
